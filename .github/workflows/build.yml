name: Compilar Mod Pennywise 1.20.1 Forge V2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Gerar projeto, modelo 3D HD, animacoes e texturas 256x256
        run: |
          python3 - << 'PYEOF'
          import os
          import struct
          import zlib

          def write_file(path, content):
              folder = os.path.dirname(path)
              if folder:
                  os.makedirs(folder, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          def save_png(path, w, h, pixels):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              def chunk(tag, data):
                  return (
                      struct.pack(">I", len(data))
                      + tag
                      + data
                      + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)
                  )
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  row = pixels[y]
                  for x in range(w):
                      r, g, b, a = row[x]
                      raw.extend((r, g, b, a))
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              png = (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", ihdr)
                  + chunk(b"IDAT", zlib.compress(bytes(raw), 9))
                  + chunk(b"IEND", b"")
              )
              with open(path, "wb") as f:
                  f.write(png)

          def new_img(w, h, fill=(0, 0, 0, 0)):
              return [[fill for _ in range(w)] for _ in range(h)]

          def set_px(img, x, y, col):
              if 0 <= y < len(img) and 0 <= x < len(img[0]):
                  img[y][x] = col

          def fill_rect(img, x, y, w, h, col):
              for yy in range(y, y + h):
                  for xx in range(x, x + w):
                      set_px(img, xx, yy, col)

          def noise_val(x, y, seed):
              n = (x * 374761393 + y * 668265263 + seed * 1442695041) & 0xFFFFFFFF
              n = ((n ^ (n >> 13)) * 1274126177) & 0xFFFFFFFF
              return (n ^ (n >> 16)) & 0xFF

          def shade(col, delta):
              return (
                  max(0, min(255, col[0] + delta)),
                  max(0, min(255, col[1] + delta)),
                  max(0, min(255, col[2] + delta)),
                  col[3],
              )

          def paint_box(img, u, v, w, h, d, base_col, grain=8, seed=1):
              rects = [
                  (u + d, v, w, d, 10),
                  (u + d + w, v, w, d, -14),
                  (u, v + d, d, h, -6),
                  (u + d, v + d, w, h, 3),
                  (u + d + w, v + d, d, h, -6),
                  (u + 2 * d + w, v + d, w, h, -10),
              ]
              for rx, ry, rw, rh, bias in rects:
                  for yy in range(ry, ry + rh):
                      for xx in range(rx, rx + rw):
                          nv = (noise_val(xx, yy, seed) % (grain * 2 + 1)) - grain
                          set_px(img, xx, yy, shade(base_col, bias + nv))

          def paint_hair_box(img, u, v, w, h, d, seed=1):
              base = (146, 26, 18, 255)
              rects = [
                  (u + d, v, w, d, 12),
                  (u + d + w, v, w, d, -18),
                  (u, v + d, d, h, -6),
                  (u + d, v + d, w, h, 4),
                  (u + d + w, v + d, d, h, -6),
                  (u + 2 * d + w, v + d, w, h, -12),
              ]
              for rx, ry, rw, rh, bias in rects:
                  for yy in range(ry, ry + rh):
                      for xx in range(rx, rx + rw):
                          strand = ((xx + (yy // 2)) % 3 == 0)
                          nv = (noise_val(xx, yy, seed) % 34) - 17
                          col = shade(base, bias + nv + (16 if strand else -8))
                          set_px(img, xx, yy, col)

          def paint_pleated_cloth(img, u, v, w, h, d, base_col, fold_col, red_trim=False, seed=1):
              paint_box(img, u, v, w, h, d, base_col, grain=7, seed=seed)
              # Vertical Victorian pleats around sides
              total_w = 2 * (w + d)
              for px in range(u, u + total_w, 3):
                  fill_rect(img, px, v + d, 1, h, fold_col)
              if red_trim:
                  fill_rect(img, u, v + d + h - 1, total_w, 1, (162, 18, 22, 255))

          def add_blood_splatter(img, x, y, w, h, density=55, seed=77):
              blood_dark = (102, 6, 10, 255)
              blood_mid = (154, 12, 16, 255)
              blood_bright = (182, 20, 22, 255)
              for yy in range(y, y + h):
                  for xx in range(x, x + w):
                      nv = noise_val(xx, yy, seed)
                      if nv < density:
                          if nv < density // 3:
                              set_px(img, xx, yy, blood_dark)
                          elif nv < (density * 4) // 5:
                              set_px(img, xx, yy, blood_mid)
                          else:
                              set_px(img, xx, yy, blood_bright)

          def generate_pennywise_texture(path, bloody=False):
              img = new_img(256, 256, (0, 0, 0, 0))

              skin = (238, 234, 226, 255)
              skin_shadow = (206, 198, 190, 255)
              suit = (224, 220, 214, 255)
              suit_bright = (238, 235, 230, 255)
              suit_fold = (176, 170, 162, 255)
              red_makeup = (178, 16, 22, 255)
              red_dark = (118, 10, 14, 255)
              pom_gold = (236, 168, 24, 255)
              mouth_abyss = (26, 3, 6, 255)
              mouth_flesh = (98, 10, 14, 255)
              tongue_col = (148, 24, 30, 255)
              tooth_white = (244, 238, 222, 255)
              boot_dark = (38, 34, 38, 255)
              blood_fresh = (146, 10, 14, 255)
              blood_deep = (88, 4, 8, 255)

              # === ROW 0: HEAD, FACE, FOREHEAD, BROW, CHEEKS, NOSE, TEETH, TONGUE, NECK ===
              # 1. upper_head (16x14x16) UV (0,0)
              paint_box(img, 0, 0, 16, 14, 16, skin, grain=5, seed=10)
              # Roof of mouth (bottom face of upper_head): x 32..48, y 0..16
              fill_rect(img, 32, 0, 16, 16, mouth_abyss)
              # High-Res 16x14 Front Face: x 16..32, y 16..30
              fx, fy = 16, 16
              # Side face subtle 3D shading
              fill_rect(img, fx + 0, fy + 0, 1, 14, skin_shadow)
              fill_rect(img, fx + 15, fy + 0, 1, 14, skin_shadow)
              # Temple dark red hairline edges
              fill_rect(img, fx + 0, fy + 0, 2, 3, (124, 22, 16, 255))
              fill_rect(img, fx + 14, fy + 0, 2, 3, (124, 22, 16, 255))
              # Forehead frown creases
              fill_rect(img, fx + 4, fy + 1, 8, 1, skin_shadow)
              fill_rect(img, fx + 5, fy + 3, 6, 1, skin_shadow)
              # Iconic Pennywise curved crimson vertical forehead points above brows
              set_px(img, fx + 4, fy + 2, red_makeup)
              set_px(img, fx + 11, fy + 2, red_makeup)
              fill_rect(img, fx + 3, fy + 3, 2, 2, red_makeup)
              fill_rect(img, fx + 11, fy + 3, 2, 2, red_makeup)
              # Angry dark brow shadow overhanging eyes
              fill_rect(img, fx + 2, fy + 4, 4, 1, (48, 18, 18, 255))
              fill_rect(img, fx + 10, fy + 4, 4, 1, (48, 18, 18, 255))
              set_px(img, fx + 6, fy + 5, (48, 18, 18, 255))
              set_px(img, fx + 9, fy + 5, (48, 18, 18, 255))
              # Deep-set sunken black eye sockets
              fill_rect(img, fx + 2, fy + 5, 4, 4, (22, 10, 12, 255))
              fill_rect(img, fx + 10, fy + 5, 4, 4, (22, 10, 12, 255))
              # Glowing eerie amber-yellow eyes + tiny evil pupils
              set_px(img, fx + 3, fy + 6, (252, 218, 92, 255))
              set_px(img, fx + 4, fy + 6, (238, 178, 30, 255))
              set_px(img, fx + 3, fy + 7, (238, 178, 30, 255))
              set_px(img, fx + 4, fy + 7, (16, 8, 8, 255))
              set_px(img, fx + 12, fy + 6, (252, 218, 92, 255))
              set_px(img, fx + 11, fy + 6, (238, 178, 30, 255))
              set_px(img, fx + 12, fy + 7, (238, 178, 30, 255))
              set_px(img, fx + 11, fy + 7, (16, 8, 8, 255))
              # Vertical red makeup stripes slicing below eyes down cheeks into grin
              fill_rect(img, fx + 3, fy + 9, 2, 2, red_makeup)
              fill_rect(img, fx + 11, fy + 9, 2, 2, red_makeup)
              set_px(img, fx + 2, fy + 10, red_makeup)
              set_px(img, fx + 13, fy + 10, red_makeup)
              set_px(img, fx + 2, fy + 11, red_makeup)
              set_px(img, fx + 3, fy + 11, red_dark)
              set_px(img, fx + 13, fy + 11, red_makeup)
              set_px(img, fx + 12, fy + 11, red_dark)
              # Nose shadow + wide upturned sinister crimson clown smile
              fill_rect(img, fx + 7, fy + 9, 2, 2, red_dark)
              fill_rect(img, fx + 2, fy + 12, 12, 1, red_makeup)
              fill_rect(img, fx + 3, fy + 13, 10, 1, red_dark)
              # Evil white buck-teeth peek along closed lip seam
              set_px(img, fx + 7, fy + 13, tooth_white)
              set_px(img, fx + 8, fy + 13, tooth_white)
              if bloody:
                  add_blood_splatter(img, fx + 1, fy + 10, 14, 4, density=120, seed=111)

              # 2. forehead_mid (15x4x15) UV (66,0) & 3. forehead_top (12x3x12) UV (128,0)
              paint_box(img, 66, 0, 15, 4, 15, skin, grain=5, seed=11)
              paint_box(img, 128, 0, 12, 3, 12, skin, grain=4, seed=12)
              # Hair shadow along back edges of dome
              fill_rect(img, 111, 15, 15, 4, (132, 24, 18, 255))

              # 4. brow_ridge (5x2x2) UV (178,0)
              paint_box(img, 178, 0, 5, 2, 2, skin_shadow, grain=5, seed=13)
              fill_rect(img, 180, 3, 5, 1, (54, 18, 18, 255))
              set_px(img, 182, 2, red_makeup)
              set_px(img, 182, 3, red_makeup)

              # 5. cheek_puff (4x4x2) UV (194,0)
              paint_box(img, 194, 0, 4, 4, 2, skin, grain=4, seed=14)
              fill_rect(img, 197, 2, 2, 4, red_makeup)

              # 6. nose (3x3x3) UV (208,0)
              paint_box(img, 208, 0, 3, 3, 3, (198, 16, 22, 255), grain=10, seed=15)

              # 7. tooth_long (1x4x1) UV (222,0) & 8. tooth_short (1x3x1) UV (228,0)
              paint_box(img, 222, 0, 1, 4, 1, tooth_white, grain=4, seed=16)
              fill_rect(img, 222, 4, 4, 1, blood_fresh)
              paint_box(img, 228, 0, 1, 3, 1, tooth_white, grain=4, seed=17)
              fill_rect(img, 228, 3, 4, 1, blood_fresh)

              # 9. tongue (8x2x10) UV (178,8) & 10. neck (8x5x8) UV (216,8)
              paint_box(img, 178, 8, 8, 2, 10, tongue_col, grain=10, seed=18)
              paint_box(img, 216, 8, 8, 5, 8, skin_shadow, grain=5, seed=19)

              # === ROW 1: JAW, CHIN, MAW CHEEKS, THROAT, UPPER GULLET ===
              # 11. jaw (16x5x16) UV (0,32)
              paint_box(img, 0, 32, 16, 5, 16, skin, grain=5, seed=20)
              # Top face of jaw (inside mouth floor): x 16..32, y 32..48
              fill_rect(img, 16, 32, 16, 16, mouth_abyss)
              fill_rect(img, 20, 35, 8, 10, tongue_col)
              # Front face of jaw: x 16..32, y 48..53
              fill_rect(img, 20, 48, 8, 1, red_makeup)
              fill_rect(img, 21, 49, 6, 1, red_dark)
              set_px(img, 19, 48, red_makeup)
              set_px(img, 28, 48, red_makeup)
              set_px(img, 23, 51, skin_shadow)
              set_px(img, 24, 51, skin_shadow)
              if bloody:
                  add_blood_splatter(img, 16, 48, 16, 5, density=170, seed=112)
                  fill_rect(img, 19, 48, 10, 2, blood_fresh)
                  fill_rect(img, 21, 50, 2, 3, blood_deep)
                  fill_rect(img, 25, 50, 2, 3, blood_fresh)

              # 12. chin_bevel (12x2x12) UV (66,32)
              paint_box(img, 66, 32, 12, 2, 12, skin_shadow, grain=5, seed=21)
              if bloody:
                  add_blood_splatter(img, 66, 44, 48, 2, density=140, seed=113)

              # 13. maw_cheek (2x10x12) UV (116,32), 14. throat_back (14x11x2) UV (146,32), 15. upper_gullet (14x3x13) UV (180,32)
              paint_box(img, 116, 32, 2, 10, 12, mouth_flesh, grain=12, seed=22)
              paint_box(img, 146, 32, 14, 11, 2, mouth_abyss, grain=4, seed=23)
              paint_box(img, 180, 32, 14, 3, 13, mouth_abyss, grain=5, seed=24)

              # === ROW 2: ALL DARK-RED CLOWN HAIR PIECES ===
              paint_hair_box(img, 0, 58, 5, 8, 12, seed=30)
              paint_hair_box(img, 36, 58, 6, 7, 10, seed=31)
              paint_hair_box(img, 70, 58, 5, 6, 8, seed=32)
              paint_hair_box(img, 98, 58, 4, 5, 6, seed=33)
              paint_hair_box(img, 120, 58, 5, 4, 6, seed=34)
              paint_hair_box(img, 144, 58, 3, 3, 4, seed=35)
              paint_hair_box(img, 160, 58, 16, 13, 5, seed=36)
              paint_hair_box(img, 204, 58, 12, 6, 4, seed=37)

              # === ROW 3: TORSO, WAIST, PELVIS, PEPLUM, POM-POMS, STAR RUFF COLLAR ===
              # 24. chest_upper (18x12x11) UV (0,82)
              paint_pleated_cloth(img, 0, 82, 18, 12, 11, suit, suit_fold, red_trim=False, seed=40)
              # Vertical crimson Victorian doublet piping on front chest (x 11..29, y 93..105)
              fill_rect(img, 14, 93, 1, 12, red_dark)
              fill_rect(img, 25, 93, 1, 12, red_dark)
              if bloody:
                  add_blood_splatter(img, 11, 93, 18, 12, density=95, seed=114)

              # 25. waist_lower (15x8x9) UV (60,82)
              paint_pleated_cloth(img, 60, 82, 15, 8, 9, suit, suit_fold, red_trim=False, seed=41)
              fill_rect(img, 60, 97, 48, 2, (152, 146, 138, 255))
              if bloody:
                  add_blood_splatter(img, 69, 91, 15, 8, density=80, seed=115)

              # 26. pelvis_core (15x6x10) UV (110,82)
              paint_pleated_cloth(img, 110, 82, 15, 6, 10, suit, suit_fold, red_trim=False, seed=42)

              # 27. peplum_front (8x9x2) UV (162,82) & 28. peplum_side (2x9x10) UV (184,82)
              paint_pleated_cloth(img, 162, 82, 8, 9, 2, suit, suit_fold, red_trim=True, seed=43)
              paint_pleated_cloth(img, 184, 82, 2, 9, 10, suit, suit_fold, red_trim=True, seed=44)
              add_blood_splatter(img, 162, 89, 20, 4, density=55, seed=45)
              if bloody:
                  add_blood_splatter(img, 162, 84, 20, 9, density=95, seed=116)
                  add_blood_splatter(img, 184, 92, 24, 9, density=85, seed=117)

              # 29. pom_pom (4x4x4) UV (210,82) & 30. pom_mini (2x2x2) UV (228,82)
              paint_box(img, 210, 82, 4, 4, 4, pom_gold, grain=22, seed=46)
              paint_box(img, 228, 82, 2, 2, 2, (226, 132, 22, 255), grain=18, seed=47)

              # 31. ruff_lower (8x3x7) UV (60,102) & 32. ruff_upper (7x3x6) UV (92,102)
              paint_pleated_cloth(img, 60, 102, 8, 3, 7, suit_bright, suit_fold, red_trim=True, seed=48)
              paint_pleated_cloth(img, 92, 102, 7, 3, 6, suit_bright, suit_fold, red_trim=True, seed=49)
              if bloody:
                  add_blood_splatter(img, 60, 102, 30, 10, density=75, seed=118)
                  add_blood_splatter(img, 92, 102, 26, 9, density=90, seed=119)

              # 33. chest_placket (6x12x2) UV (120,102)
              paint_pleated_cloth(img, 120, 102, 6, 12, 2, suit_bright, suit_fold, red_trim=False, seed=50)
              fill_rect(img, 122, 104, 1, 12, red_makeup)
              fill_rect(img, 127, 104, 1, 12, red_makeup)
              if bloody:
                  add_blood_splatter(img, 122, 104, 6, 12, density=110, seed=120)

              # === ROW 4: PUFFED SHOULDERS, ARMS, WRIST RUFFLES, 5-FINGERED HANDS ===
              # 34. shoulder_puff (11x9x11) UV (0,124)
              paint_pleated_cloth(img, 0, 124, 11, 9, 11, suit_bright, suit_fold, red_trim=False, seed=60)
              # Slashed Renaissance crimson stripe lines on puffed shoulders
              for px in range(2, 44, 5):
                  fill_rect(img, px, 136, 1, 7, red_dark)
              # 35. upper_arm (8x12x8) UV (46,124)
              paint_pleated_cloth(img, 46, 124, 8, 12, 8, suit, suit_fold, red_trim=False, seed=61)
              # 36. elbow_ruff (9x3x9) UV (80,124)
              paint_pleated_cloth(img, 80, 124, 9, 3, 9, suit_bright, suit_fold, red_trim=True, seed=62)
              # 37. forearm (6x12x6) UV (118,124)
              paint_pleated_cloth(img, 118, 124, 6, 12, 6, suit, suit_fold, red_trim=False, seed=63)
              add_blood_splatter(img, 118, 137, 24, 5, density=55, seed=64)
              # 38. wrist_ruff (5x3x4) UV (144,124)
              paint_pleated_cloth(img, 144, 124, 5, 3, 4, suit_bright, suit_fold, red_trim=True, seed=65)
              # 39. palm (6x5x3) UV (164,124), 40. finger_long (1x7x1) UV (184,124),
              # 41. finger_mid (1x6x1) UV (190,124), 42. thumb (2x4x2) UV (196,124)
              paint_box(img, 164, 124, 6, 5, 3, suit_bright, grain=5, seed=66)
              paint_box(img, 184, 124, 1, 7, 1, suit_bright, grain=4, seed=67)
              paint_box(img, 190, 124, 1, 6, 1, suit_bright, grain=4, seed=68)
              paint_box(img, 196, 124, 2, 4, 2, suit_bright, grain=4, seed=69)
              # Subtle crimson stained fingertips (like the video)
              fill_rect(img, 184, 130, 4, 2, blood_fresh)
              fill_rect(img, 190, 129, 4, 2, blood_fresh)
              fill_rect(img, 196, 128, 8, 2, blood_fresh)
              # 43. shoulder_stripe (12x7x3) UV (206,124)
              paint_pleated_cloth(img, 206, 124, 12, 7, 3, suit, suit_fold, red_trim=True, seed=70)
              if bloody:
                  add_blood_splatter(img, 164, 124, 18, 8, density=190, seed=121)
                  add_blood_splatter(img, 184, 124, 20, 8, density=200, seed=122)
                  add_blood_splatter(img, 144, 124, 18, 7, density=145, seed=123)
                  add_blood_splatter(img, 118, 130, 24, 12, density=115, seed=124)
                  add_blood_splatter(img, 0, 134, 44, 10, density=60, seed=125)

              # === ROW 5: BAGGY BREECHES, KNEE RUFFLES, SHINS, ANKLE RUFFLES & BOOTS ===
              # 44. thigh_core (8x14x8) UV (0,156) & 45. thigh_puff (10x9x10) UV (34,156)
              paint_pleated_cloth(img, 0, 156, 8, 14, 8, suit, suit_fold, red_trim=False, seed=80)
              paint_pleated_cloth(img, 34, 156, 10, 9, 10, suit_bright, suit_fold, red_trim=False, seed=81)
              # 46. knee_ruff (8x3x8) UV (76,156)
              paint_pleated_cloth(img, 76, 156, 8, 3, 8, suit_bright, suit_fold, red_trim=True, seed=82)
              # 47. shin (6x11x6) UV (110,156) - already blood-stained on lower legs like video!
              paint_pleated_cloth(img, 110, 156, 6, 11, 6, suit, suit_fold, red_trim=False, seed=83)
              add_blood_splatter(img, 110, 162, 24, 11, density=80, seed=84)
              # 48. ankle_ruff (8x3x8) UV (136,156)
              paint_pleated_cloth(img, 136, 156, 8, 3, 8, suit_bright, suit_fold, red_trim=True, seed=85)
              # 49. boot_base (8x4x10) UV (170,156) & 50. boot_toe (6x3x4) UV (208,156)
              paint_box(img, 170, 156, 8, 4, 10, boot_dark, grain=6, seed=86)
              paint_box(img, 208, 156, 6, 3, 4, boot_dark, grain=6, seed=87)
              if bloody:
                  add_blood_splatter(img, 34, 166, 40, 9, density=85, seed=126)
                  add_blood_splatter(img, 76, 162, 32, 5, density=110, seed=127)
                  add_blood_splatter(img, 110, 162, 24, 11, density=140, seed=128)

              save_png(path, 256, 256, img)

          def generate_victim_texture(path):
              img = new_img(64, 64, (0, 0, 0, 0))
              skin = (232, 188, 152, 255)
              hair = (88, 54, 34, 255)
              shirt = (240, 240, 242, 255)
              pants = (232, 232, 236, 255)
              shoe = (108, 70, 44, 255)

              paint_box(img, 0, 0, 8, 8, 8, skin, grain=4, seed=50)
              fill_rect(img, 8, 0, 8, 8, hair)
              fill_rect(img, 24, 8, 8, 7, hair)
              fill_rect(img, 0, 8, 8, 3, hair)
              fill_rect(img, 16, 8, 8, 3, hair)
              fill_rect(img, 8, 8, 8, 2, hair)
              set_px(img, 8, 10, hair)
              set_px(img, 15, 10, hair)
              set_px(img, 9, 12, (245, 245, 245, 255))
              set_px(img, 10, 12, (56, 42, 34, 255))
              set_px(img, 13, 12, (56, 42, 34, 255))
              set_px(img, 14, 12, (245, 245, 245, 255))
              fill_rect(img, 11, 14, 2, 1, (176, 124, 98, 255))

              paint_box(img, 16, 16, 8, 12, 4, shirt, grain=5, seed=51)
              fill_rect(img, 20, 20, 8, 1, (212, 212, 218, 255))

              for au, av in ((40, 16), (32, 48)):
                  paint_box(img, au, av, 4, 12, 4, shirt, grain=5, seed=52)
                  fill_rect(img, au, av + 12, 16, 4, skin)
                  fill_rect(img, au + 8, av, 4, 4, skin)

              for lu, lv in ((0, 16), (16, 48)):
                  paint_box(img, lu, lv, 4, 12, 4, pants, grain=5, seed=53)
                  fill_rect(img, lu, lv + 13, 16, 3, shoe)
                  fill_rect(img, lu + 8, lv, 4, 4, shoe)

              save_png(path, 64, 64, img)

