                  PartDefinition upperHead = head.addOrReplaceChild("upper_head",
                          CubeListBuilder.create()
                                  .texOffs(0, 0).addBox(-4.5F, -8.0F, -6.5F, 9.0F, 8.0F, 9.0F)
                                  .texOffs(36, 0).addBox(-4.0F, -9.5F, -6.0F, 8.0F, 2.0F, 8.0F)
                                  .texOffs(36, 10).addBox(-1.0F, -3.2F, -7.8F, 2.0F, 2.0F, 2.0F)
