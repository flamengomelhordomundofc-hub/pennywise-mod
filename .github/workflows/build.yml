          # Entity: PennywiseEntity
          write_file("src/main/java/com/pennywisemod/entity/PennywiseEntity.java", """\
          package com.pennywisemod.entity;

          import net.minecraft.core.particles.BlockParticleOption;
          import net.minecraft.core.particles.DustParticleOptions;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.syncher.EntityDataAccessor;
          import net.minecraft.network.syncher.EntityDataSerializers;
          import net.minecraft.network.syncher.SynchedEntityData;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundEvent;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.util.Mth;
          import net.minecraft.world.damagesource.DamageSource;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.AnimationState;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.Mob;
          import net.minecraft.world.entity.ai.attributes.AttributeSupplier;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.entity.ai.goal.FloatGoal;
          import net.minecraft.world.entity.ai.goal.Goal;
          import net.minecraft.world.entity.ai.goal.LookAtPlayerGoal;
          import net.minecraft.world.entity.ai.goal.RandomLookAroundGoal;
          import net.minecraft.world.entity.ai.goal.WaterAvoidingRandomStrollGoal;
          import net.minecraft.world.entity.ai.goal.target.HurtByTargetGoal;
          import net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal;
          import net.minecraft.world.entity.animal.IronGolem;
          import net.minecraft.world.entity.monster.Monster;
          import net.minecraft.world.entity.npc.Villager;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.phys.Vec3;
          import org.joml.Vector3f;

          import java.util.EnumSet;

          public class PennywiseEntity extends Monster {
              private static final EntityDataAccessor<Boolean> DATA_DEVOURING =
                      SynchedEntityData.defineId(PennywiseEntity.class, EntityDataSerializers.BOOLEAN);
              private static final EntityDataAccessor<Integer> DATA_DEVOUR_TICK =
                      SynchedEntityData.defineId(PennywiseEntity.class, EntityDataSerializers.INT);
              private static final EntityDataAccessor<Integer> DATA_GRABBED_ID =
                      SynchedEntityData.defineId(PennywiseEntity.class, EntityDataSerializers.INT);
              private static final EntityDataAccessor<Boolean> DATA_BLOODY =
                      SynchedEntityData.defineId(PennywiseEntity.class, EntityDataSerializers.BOOLEAN);
              private static final EntityDataAccessor<Float> DATA_GRAB_YAW =
                      SynchedEntityData.defineId(PennywiseEntity.class, EntityDataSerializers.FLOAT);

              public static final int TOTAL_DEVOUR_TICKS = 135;

              public final AnimationState idleAnimationState = new AnimationState();
              public final AnimationState devourAnimationState = new AnimationState();

              private boolean wasDevouringClient = false;
              private int devourCooldown = 0;
              private int bloodyTimer = 0;

              public PennywiseEntity(EntityType<? extends Monster> type, Level level) {
                  super(type, level);
                  this.xpReward = 50;
              }

              public static AttributeSupplier.Builder createAttributes() {
                  return Monster.createMonsterAttributes()
                          .add(Attributes.MAX_HEALTH, 200.0D)
                          .add(Attributes.MOVEMENT_SPEED, 0.31D)
                          .add(Attributes.ATTACK_DAMAGE, 14.0D)
                          .add(Attributes.FOLLOW_RANGE, 40.0D)
                          .add(Attributes.KNOCKBACK_RESISTANCE, 0.75D);
              }

              @Override
              protected void defineSynchedData() {
                  super.defineSynchedData();
                  this.entityData.define(DATA_DEVOURING, false);
                  this.entityData.define(DATA_DEVOUR_TICK, 0);
                  this.entityData.define(DATA_GRABBED_ID, -1);
                  this.entityData.define(DATA_BLOODY, false);
                  this.entityData.define(DATA_GRAB_YAW, 0.0F);
              }

              @Override
              protected void registerGoals() {
                  this.goalSelector.addGoal(0, new FloatGoal(this));
                  this.goalSelector.addGoal(1, new DevourAttackGoal(this));
                  this.goalSelector.addGoal(2, new WaterAvoidingRandomStrollGoal(this, 0.75D));
                  this.goalSelector.addGoal(3, new LookAtPlayerGoal(this, Player.class, 12.0F));
                  this.goalSelector.addGoal(4, new RandomLookAroundGoal(this));

                  this.targetSelector.addGoal(1, new HurtByTargetGoal(this));
                  this.targetSelector.addGoal(2, new NearestAttackableTargetGoal<>(this, VictimEntity.class, true));
                  this.targetSelector.addGoal(3, new NearestAttackableTargetGoal<>(this, Villager.class, true));
                  this.targetSelector.addGoal(4, new NearestAttackableTargetGoal<>(this, Player.class, true));
                  this.targetSelector.addGoal(5, new NearestAttackableTargetGoal<>(this, IronGolem.class, true));
              }

              public boolean isDevouring() {
                  return this.entityData.get(DATA_DEVOURING);
              }

              public void setDevouring(boolean value) {
                  this.entityData.set(DATA_DEVOURING, value);
              }

              public int getDevourTick() {
                  return this.entityData.get(DATA_DEVOUR_TICK);
              }

              public void setDevourTick(int tick) {
                  this.entityData.set(DATA_DEVOUR_TICK, tick);
              }

              public int getGrabbedId() {
                  return this.entityData.get(DATA_GRABBED_ID);
              }

              public void setGrabbedId(int id) {
                  this.entityData.set(DATA_GRABBED_ID, id);
              }

              public boolean isBloody() {
                  return this.entityData.get(DATA_BLOODY);
              }

              public void setBloody(boolean bloody) {
                  this.entityData.set(DATA_BLOODY, bloody);
              }

              public float getGrabYaw() {
                  return this.entityData.get(DATA_GRAB_YAW);
              }

              public void setGrabYaw(float yaw) {
                  this.entityData.set(DATA_GRAB_YAW, yaw);
              }

              public void startDevour(LivingEntity target) {
                  double dx = target.getX() - this.getX();
                  double dz = target.getZ() - this.getZ();
                  float yaw = (float) (Mth.atan2(dz, dx) * (180.0D / Math.PI)) - 90.0F;
                  this.setGrabYaw(yaw);
                  this.setYRot(yaw);
                  this.yBodyRot = yaw;
                  this.yHeadRot = yaw;
                  this.setGrabbedId(target.getId());
                  this.setDevourTick(0);
                  this.setDevouring(true);
                  this.getNavigation().stop();
                  this.setDeltaMovement(Vec3.ZERO);
                  this.playSound(SoundEvents.EVOKER_PREPARE_ATTACK, 1.1F, 0.62F);
              }

              private void cancelDevour() {
                  this.setDevouring(false);
                  this.setDevourTick(0);
                  this.setGrabbedId(-1);
                  this.devourCooldown = 45;
              }

              @Override
              public void tick() {
                  super.tick();

                  if (this.level().isClientSide()) {
                      boolean devouring = this.isDevouring();
                      if (devouring && !this.wasDevouringClient) {
                          this.devourAnimationState.start(this.tickCount);
                      } else if (!devouring && this.wasDevouringClient) {
                          this.devourAnimationState.stop();
                      }
                      this.wasDevouringClient = devouring;

                      if (!devouring) {
                          this.idleAnimationState.startIfStopped(this.tickCount);
                      } else {
                          this.idleAnimationState.stop();
                      }

                      if (devouring) {
                          float yaw = this.getGrabYaw();
                          this.setYRot(yaw);
                          this.yBodyRot = yaw;
                          this.yHeadRot = yaw;
                          this.holdVictimClient(yaw, this.getDevourTick());
                      }
                      return;
                  }

                  if (this.devourCooldown > 0) {
                      this.devourCooldown--;
                  }

                  if (this.bloodyTimer > 0) {
                      this.bloodyTimer--;
                      if (this.bloodyTimer == 0) {
                          this.setBloody(false);
                      }
                  }

                  if (this.isDevouring()) {
                      this.tickDevourServer();
                  }
              }

              private Vec3 computeHoldPosition(float yaw, int t) {
                  double rad = Math.toRadians(yaw);
                  double fx = -Math.sin(rad);
                  double fz = Math.cos(rad);
                  float pull = Mth.clamp((t - 3) / 18.0F, 0.0F, 1.0F);
                  double dist = Mth.lerp(pull, 1.05D, 0.72D);
                  double shake = (t > 22) ? Math.sin(t * 0.75D) * 0.05D : 0.0D;
                  double yOff = Mth.lerp(pull, 0.05D, 0.42D) + shake;
                  return new Vec3(this.getX() + fx * dist, this.getY() + yOff, this.getZ() + fz * dist);
              }

              private void holdVictimClient(float yaw, int t) {
                  if (t < 3 || t >= 87) return;
                  int id = this.getGrabbedId();
                  if (id < 0) return;
                  Entity entity = this.level().getEntity(id);
                  if (entity instanceof LivingEntity victim && !(victim instanceof Player) && victim.isAlive()) {
                      Vec3 pos = this.computeHoldPosition(yaw, t);
                      float victimYaw = yaw + 180.0F;
                      victim.setPos(pos.x, pos.y, pos.z);
                      victim.xo = pos.x;
                      victim.yo = pos.y;
                      victim.zo = pos.z;
                      victim.setDeltaMovement(Vec3.ZERO);
                      victim.setOnGround(false);
                      victim.setYRot(victimYaw);
                      victim.setYBodyRot(victimYaw);
                      victim.setYHeadRot(victimYaw);
                  }
              }

              private void tickDevourServer() {
                  int t = this.getDevourTick();
                  float yaw = this.getGrabYaw();

                  this.getNavigation().stop();
                  this.setDeltaMovement(0.0D, Math.min(0.0D, this.getDeltaMovement().y), 0.0D);
                  this.setYRot(yaw);
                  this.yBodyRot = yaw;
                  this.yHeadRot = yaw;
                  this.yRotO = yaw;
                  this.yBodyRotO = yaw;
                  this.yHeadRotO = yaw;

                  LivingEntity victim = null;
                  int grabbedId = this.getGrabbedId();
                  if (grabbedId >= 0) {
                      Entity e = this.level().getEntity(grabbedId);
                      if (e instanceof LivingEntity living && living.isAlive()) {
                          victim = living;
                      }
                  }

                  // Hold target tightly from tick 3 until the lethal chomp at tick 86
                  if (t >= 3 && t < 87) {
                      if (victim == null) {
                          if (t < 40) {
                              this.cancelDevour();
                              return;
                          }
                      } else {
                          Vec3 holdPos = this.computeHoldPosition(yaw, t);
                          float victimYaw = yaw + 180.0F;
                          if (victim instanceof Player player) {
                              if (player.isCreative() || player.isSpectator() || this.distanceToSqr(player) > 20.0D) {
                                  this.cancelDevour();
                                  return;
                              }
                              Vec3 pullVec = holdPos.subtract(player.position()).scale(0.55D);
                              player.setDeltaMovement(pullVec);
                              player.hurtMarked = true;
                              player.fallDistance = 0.0F;
                              player.addEffect(new MobEffectInstance(MobEffects.MOVEMENT_SLOWDOWN, 12, 6, false, false));
                              player.addEffect(new MobEffectInstance(MobEffects.DARKNESS, 25, 0, false, false));
                          } else {
                              victim.setPos(holdPos.x, holdPos.y, holdPos.z);
                              victim.setDeltaMovement(Vec3.ZERO);
                              victim.setOnGround(false);
                              victim.fallDistance = 0.0F;
                              victim.setYRot(victimYaw);
                              victim.setYBodyRot(victimYaw);
                              victim.setYHeadRot(victimYaw);
                              if (victim instanceof Mob mob) {
                                  mob.getNavigation().stop();
                              }
                          }
                      }
                  }

                  // Jaw unhinges terrifyingly wide
                  if (t == 20) {
                      this.playSound(SoundEvents.RAVAGER_ROAR, 0.85F, 1.35F);
                      this.playSound(SoundEvents.ENDERMAN_SCREAM, 0.7F, 0.55F);
                  }

                  // Violent Bite #1 and Bite #2
                  if (t == 44 || t == 64) {
                      this.playSound(SoundEvents.GENERIC_EAT, 1.5F, 0.6F);
                      this.playSound(SoundEvents.PHANTOM_BITE, 1.4F, 0.55F);
                      this.playSound(SoundEvents.ZOMBIE_ATTACK_WOODEN_DOOR, 0.5F, 0.55F);
                      this.spawnBloodBurst(yaw, 38, 24, 0.35D);
                      if (victim != null) {
                          float nonLethalDmg = Math.min(4.0F, Math.max(0.0F, victim.getHealth() - 2.0F));
                          if (nonLethalDmg > 0.0F) {
                              victim.hurt(this.damageSources().mobAttack(this), nonLethalDmg);
                          }
                      }
                  }

                  // Continuous dripping blood spray during chewing phase
                  if (t >= 44 && t <= 90 && t % 2 == 0) {
                      this.spawnBloodBurst(yaw, 8, 6, 0.25D);
                  }

                  // Final lethal devour chomp (victim vanishes in blood splatter!)
                  if (t == 86) {
                      this.playSound(SoundEvents.GENERIC_EAT, 1.8F, 0.45F);
                      this.playSound(SoundEvents.PHANTOM_BITE, 1.6F, 0.45F);
                      this.playSound(SoundEvents.PLAYER_BURP, 0.85F, 0.45F);
                      this.spawnBloodBurst(yaw, 85, 55, 0.55D);
                      this.setBloody(true);
                      this.bloodyTimer = 600;
                      this.heal(20.0F);
                      if (victim != null) {
                          if (victim instanceof Player player) {
                              if (!player.isCreative() && !player.isSpectator()) {
                                  player.hurt(this.damageSources().mobAttack(this), 9999.0F);
                              }
                          } else {
                              victim.hurt(this.damageSources().mobAttack(this), 9999.0F);
                              victim.discard();
                          }
                      }
                      this.setGrabbedId(-1);
                  }

                  // Stands upright, wipes mouth and giggles sinisterly
                  if (t == 96) {
                      this.playSound(SoundEvents.WITCH_CELEBRATE, 1.15F, 0.62F);
                      this.playSound(SoundEvents.EVOKER_CELEBRATE, 0.85F, 0.68F);
                  }

                  if (t >= TOTAL_DEVOUR_TICKS) {
                      this.cancelDevour();
                  } else {
                      this.setDevourTick(t + 1);
                  }
              }

              private void spawnBloodBurst(float yaw, int blockCount, int dustCount, double spread) {
                  if (!(this.level() instanceof ServerLevel serverLevel)) return;
                  double rad = Math.toRadians(yaw);
                  double bx = this.getX() - Math.sin(rad) * 0.78D;
                  double by = this.getY() + 1.55D;
                  double bz = this.getZ() + Math.cos(rad) * 0.78D;

                  BlockParticleOption redstoneBlood = new BlockParticleOption(
                          ParticleTypes.BLOCK, Blocks.REDSTONE_BLOCK.defaultBlockState());
                  DustParticleOptions crimsonMist = new DustParticleOptions(
                          new Vector3f(0.72F, 0.02F, 0.02F), 1.65F);

                  serverLevel.sendParticles(redstoneBlood, bx, by, bz, blockCount, spread, spread, spread, 0.16D);
                  serverLevel.sendParticles(crimsonMist, bx, by, bz, dustCount, spread * 1.1D, spread * 1.1D, spread * 1.1D, 0.08D);
              }

              @Override
              public void addAdditionalSaveData(CompoundTag tag) {
                  super.addAdditionalSaveData(tag);
                  tag.putBoolean("Bloody", this.isBloody());
                  tag.putInt("BloodyTimer", this.bloodyTimer);
              }

              @Override
              public void readAdditionalSaveData(CompoundTag tag) {
                  super.readAdditionalSaveData(tag);
                  this.setBloody(tag.getBoolean("Bloody"));
                  this.bloodyTimer = tag.getInt("BloodyTimer");
              }

              @Override
              protected SoundEvent getAmbientSound() {
                  return SoundEvents.WITCH_AMBIENT;
              }

              @Override
              protected SoundEvent getHurtSound(DamageSource source) {
                  return SoundEvents.EVOKER_HURT;
              }

              @Override
              protected SoundEvent getDeathSound() {
                  return SoundEvents.EVOKER_DEATH;
              }

              @Override
              public float getVoicePitch() {
                  return 0.65F;
              }

              private static class DevourAttackGoal extends Goal {
                  private final PennywiseEntity mob;
                  private int repathTicks;

                  public DevourAttackGoal(PennywiseEntity mob) {
                      this.mob = mob;
                      this.setFlags(EnumSet.of(Flag.MOVE, Flag.LOOK));
                  }

                  @Override
                  public boolean canUse() {
                      if (this.mob.isDevouring()) return true;
                      LivingEntity target = this.mob.getTarget();
                      return target != null && target.isAlive();
                  }

                  @Override
                  public boolean canContinueToUse() {
                      if (this.mob.isDevouring()) return true;
                      LivingEntity target = this.mob.getTarget();
                      return target != null && target.isAlive();
                  }

                  @Override
                  public void start() {
                      this.repathTicks = 0;
                  }

                  @Override
                  public void tick() {
                      if (this.mob.isDevouring()) {
                          this.mob.getNavigation().stop();
                          return;
                      }
                      LivingEntity target = this.mob.getTarget();
                      if (target == null) return;

                      this.mob.getLookControl().setLookAt(target, 30.0F, 30.0F);
                      double distSqr = this.mob.distanceToSqr(target);

                      if (distSqr <= 2.35D * 2.35D && this.mob.devourCooldown <= 0 && this.mob.hasLineOfSight(target)) {
                          this.mob.startDevour(target);
                          return;
                      }

                      if (--this.repathTicks <= 0) {
                          this.repathTicks = 6;
                          this.mob.getNavigation().moveTo(target, 1.15D);
                      }
                  }
              }
          }
          """)

