                  PartDefinition jaw = head.addOrReplaceChild("jaw",
                          CubeListBuilder.create()
                                  .texOffs(0, 19).addBox(-4.5F, 0.0F, -6.5F, 9.0F, 3.0F, 9.0F),
                          PartPose.offset(0.0F, -2.5F, 2.0F));

                  // Lower razor-sharp teeth row
                  CubeListBuilder lowerTeethBuilder = CubeListBuilder.create();
                  for (int i = 0; i < 6; i++) {
                      float tx = -3.7F + i * 1.28F;
                      lowerTeethBuilder.texOffs(36, 14).addBox(tx, -1.7F, -6.1F, 1.0F, 2.0F, 1.0F, new CubeDeformation(-0.12F));
                      lowerTeethBuilder.texOffs(36, 14).addBox(tx, -1.5F, -4.6F, 1.0F, 2.0F, 1.0F, new CubeDeformation(-0.16F));
                  }
                  jaw.addOrReplaceChild("lower_teeth", lowerTeethBuilder, PartPose.ZERO);

                  // Stretched dark-red fleshy maw sides + throat back when mouth opens wide
                  head.addOrReplaceChild("maw_cheeks",
                          CubeListBuilder.create()
                                  .texOffs(86, 36).addBox(-4.2F, -1.0F, -3.5F, 1.0F, 4.0F, 5.0F)
                                  .texOffs(86, 36).addBox(3.2F, -1.0F, -3.5F, 1.0F, 4.0F, 5.0F)
                                  .texOffs(100, 36).addBox(-4.0F, -1.0F, 1.0F, 8.0F, 4.0F, 1.0F),
                          PartPose.offset(0.0F, -2.5F, 0.0F));

                  // Right Arm (puffed Victorian shoulder + ruffled cuff + clawed hand)
                  PartDefinition rightArm = torso.addOrReplaceChild("right_arm",
                          CubeListBuilder.create()
                                  .texOffs(0, 64).addBox(-4.5F, -1.5F, -3.0F, 5.0F, 6.0F, 6.0F),
                          PartPose.offset(-5.5F, -9.8F, 0.0F));

                  rightArm.addOrReplaceChild("right_forearm",
                          CubeListBuilder.create()
                                  .texOffs(24, 64).addBox(-2.0F, 0.0F, -2.0F, 4.0F, 6.0F, 4.0F)
                                  .texOffs(42, 64).addBox(-2.5F, 5.0F, -2.5F, 5.0F, 2.0F, 5.0F)
                                  .texOffs(64, 64).addBox(-2.0F, 6.8F, -2.0F, 4.0F, 4.0F, 4.0F),
                          PartPose.offset(-2.0F, 4.5F, 0.0F));

                  // Left Arm
                  PartDefinition leftArm = torso.addOrReplaceChild("left_arm",
                          CubeListBuilder.create()
                                  .texOffs(0, 64).mirror().addBox(-0.5F, -1.5F, -3.0F, 5.0F, 6.0F, 6.0F),
                          PartPose.offset(5.5F, -9.8F, 0.0F));

                  leftArm.addOrReplaceChild("left_forearm",
                          CubeListBuilder.create()
                                  .texOffs(24, 64).mirror().addBox(-2.0F, 0.0F, -2.0F, 4.0F, 6.0F, 4.0F)
                                  .texOffs(42, 64).mirror().addBox(-2.5F, 5.0F, -2.5F, 5.0F, 2.0F, 5.0F)
                                  .texOffs(64, 64).mirror().addBox(-2.0F, 6.8F, -2.0F, 4.0F, 4.0F, 4.0F),
                          PartPose.offset(2.0F, 4.5F, 0.0F));

                  // Right Leg (puffed trouser thigh + shin + dark Victorian clown shoe)
                  PartDefinition rightLeg = bodyRoot.addOrReplaceChild("right_leg",
                          CubeListBuilder.create()
                                  .texOffs(0, 80).addBox(-2.5F, 0.0F, -2.5F, 5.0F, 7.0F, 5.0F),
                          PartPose.offset(-2.6F, -14.0F, 0.0F));

                  rightLeg.addOrReplaceChild("right_shin",
                          CubeListBuilder.create()
                                  .texOffs(22, 80).addBox(-2.0F, 0.0F, -2.0F, 4.0F, 5.0F, 4.0F)
                                  .texOffs(40, 80).addBox(-2.0F, 5.0F, -4.0F, 4.0F, 2.0F, 6.0F),
                          PartPose.offset(0.0F, 7.0F, 0.0F));

                  // Left Leg
                  PartDefinition leftLeg = bodyRoot.addOrReplaceChild("left_leg",
                          CubeListBuilder.create()
                                  .texOffs(0, 80).mirror().addBox(-2.5F, 0.0F, -2.5F, 5.0F, 7.0F, 5.0F),
                          PartPose.offset(2.6F, -14.0F, 0.0F));

                  leftLeg.addOrReplaceChild("left_shin",
                          CubeListBuilder.create()
                                  .texOffs(22, 80).mirror().addBox(-2.0F, 0.0F, -2.0F, 4.0F, 5.0F, 4.0F)
                                  .texOffs(40, 80).mirror().addBox(-2.0F, 5.0F, -4.0F, 4.0F, 2.0F, 6.0F),
                          PartPose.offset(0.0F, 7.0F, 0.0F));

                  return LayerDefinition.create(mesh, 128, 128);
              }

              @Override
              public ModelPart root() {
                  return this.root;
              }

              @Override
              public void setupAnim(PennywiseEntity entity, float limbSwing, float limbSwingAmount,
                                    float ageInTicks, float netHeadYaw, float headPitch) {
                  this.root().getAllParts().forEach(ModelPart::resetPose);

                  if (entity.isDevouring()) {
                      this.animate(entity.devourAnimationState, PennywiseAnimations.DEVOUR, ageInTicks, 1.0F);
                  } else {
                      this.head.yRot += Mth.clamp(netHeadYaw, -45.0F, 45.0F) * ((float) Math.PI / 180.0F);
                      this.head.xRot += Mth.clamp(headPitch, -25.0F, 25.0F) * ((float) Math.PI / 180.0F);

                      // Menacing stalking walk cycle
                      this.rightLeg.xRot += Mth.cos(limbSwing * 0.6662F) * 0.9F * limbSwingAmount;
                      this.leftLeg.xRot += Mth.cos(limbSwing * 0.6662F + (float) Math.PI) * 0.9F * limbSwingAmount;
                      this.rightShin.xRot += Math.max(0.0F, Mth.sin(limbSwing * 0.6662F)) * 0.55F * limbSwingAmount;
                      this.leftShin.xRot += Math.max(0.0F, Mth.sin(limbSwing * 0.6662F + (float) Math.PI)) * 0.55F * limbSwingAmount;
                      this.rightArm.xRot += Mth.cos(limbSwing * 0.6662F + (float) Math.PI) * 0.75F * limbSwingAmount;
                      this.leftArm.xRot += Mth.cos(limbSwing * 0.6662F) * 0.75F * limbSwingAmount;
                      this.rightForearm.xRot -= 0.25F * limbSwingAmount;
                      this.leftForearm.xRot -= 0.25F * limbSwingAmount;
                      this.torso.xRot += 0.16F * limbSwingAmount;

                      this.animate(entity.idleAnimationState, PennywiseAnimations.IDLE, ageInTicks, 1.0F);
                  }

                  boolean mouthOpen = this.jaw.xRot > 0.12F;
                  this.upperTeeth.visible = mouthOpen;
                  this.lowerTeeth.visible = mouthOpen;
                  this.innerMouth.visible = mouthOpen;
                  this.mawCheeks.visible = mouthOpen;
                  if (mouthOpen) {
                      this.mawCheeks.yScale = Mth.clamp(this.jaw.xRot * 1.45F, 0.35F, 1.85F);
                  }
              }
          }
          """)

