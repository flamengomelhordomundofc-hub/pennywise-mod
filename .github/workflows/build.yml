          package com.pennywisemod.client;

          import com.mojang.blaze3d.vertex.PoseStack;
          import com.pennywisemod.PennywiseMod;
          import com.pennywisemod.entity.PennywiseEntity;
          import net.minecraft.client.renderer.entity.EntityRendererProvider;
          import net.minecraft.client.renderer.entity.MobRenderer;
          import net.minecraft.resources.ResourceLocation;

          public class PennywiseRenderer extends MobRenderer<PennywiseEntity, PennywiseModel> {
              private static final ResourceLocation CLEAN_TEXTURE =
                      new ResourceLocation(PennywiseMod.MOD_ID, "textures/entity/pennywise.png");
              private static final ResourceLocation BLOODY_TEXTURE =
                      new ResourceLocation(PennywiseMod.MOD_ID, "textures/entity/pennywise_bloody.png");

              public PennywiseRenderer(EntityRendererProvider.Context context) {
                  super(context, new PennywiseModel(context.bakeLayer(PennywiseModel.LAYER_LOCATION)), 0.75F);
              }

              @Override
              public ResourceLocation getTextureLocation(PennywiseEntity entity) {
                  return entity.isBloody() ? BLOODY_TEXTURE : CLEAN_TEXTURE;
              }

              @Override
              protected void scale(PennywiseEntity entity, PoseStack poseStack, float partialTickTime) {
                  poseStack.scale(1.06F, 1.06F, 1.06F);
                  super.scale(entity, poseStack, partialTickTime);
              }
          }
          """)

