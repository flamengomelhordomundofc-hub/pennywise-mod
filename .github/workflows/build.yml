                                  .texOffs(74, 0).addBox(3.8F, -8.2F, -5.2F, 4.0F, 7.0F, 8.0F)
                                  .texOffs(86, 20).addBox(-8.6F, -7.2F, -4.2F, 2.0F, 5.0F, 6.0F)
                                  .texOffs(86, 20).addBox(6.6F, -7.2F, -4.2F, 2.0F, 5.0F, 6.0F)
                                  .texOffs(98, 0).addBox(-3.5F, -11.2F, -4.0F, 7.0F, 3.0F, 6.0F)
