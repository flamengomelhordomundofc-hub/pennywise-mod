name: Compilar Mod Pennywise 1.20.1 Forge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Gerar projeto, modelos, animacoes e texturas
        run: |
          python3 - << 'PYEOF'
          import os
          import struct
          import zlib

          def write_file(path, content):
              folder = os.path.dirname(path)
              if folder:
                  os.makedirs(folder, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          def save_png(path, w, h, pixels):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              def chunk(tag, data):
                  return (
                      struct.pack(">I", len(data))
                      + tag
                      + data
                      + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)
                  )
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  row = pixels[y]
                  for x in range(w):
                      r, g, b, a = row[x]
                      raw.extend((r, g, b, a))
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              png = (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", ihdr)
                  + chunk(b"IDAT", zlib.compress(bytes(raw), 9))
                  + chunk(b"IEND", b"")
              )
              with open(path, "wb") as f:
                  f.write(png)

          def new_img(w, h, fill=(0, 0, 0, 0)):
              return [[fill for _ in range(w)] for _ in range(h)]

          def set_px(img, x, y, col):
              if 0 <= y < len(img) and 0 <= x < len(img[0]):
                  img[y][x] = col

          def fill_rect(img, x, y, w, h, col):
              for yy in range(y, y + h):
                  for xx in range(x, x + w):
                      set_px(img, xx, yy, col)

          def noise_val(x, y, seed):
              n = (x * 374761393 + y * 668265263 + seed * 1442695041) & 0xFFFFFFFF
              n = ((n ^ (n >> 13)) * 1274126177) & 0xFFFFFFFF
              return (n ^ (n >> 16)) & 0xFF

          def shade(col, delta):
              return (
                  max(0, min(255, col[0] + delta)),
                  max(0, min(255, col[1] + delta)),
                  max(0, min(255, col[2] + delta)),
                  col[3],
              )

          def paint_box(img, u, v, w, h, d, base_col, grain=10, seed=1):
              rects = [
                  (u + d, v, w, d, 8),
                  (u + d + w, v, w, d, -14),
                  (u, v + d, d, h, -6),
                  (u + d, v + d, w, h, 2),
                  (u + d + w, v + d, d, h, -6),
                  (u + 2 * d + w, v + d, w, h, -10),
              ]
              for rx, ry, rw, rh, bias in rects:
                  for yy in range(ry, ry + rh):
                      for xx in range(rx, rx + rw):
                          nv = (noise_val(xx, yy, seed) % (grain * 2 + 1)) - grain
                          set_px(img, xx, yy, shade(base_col, bias + nv))

          def add_blood_splatter(img, x, y, w, h, density=42, seed=77):
              blood_dark = (112, 8, 12, 255)
              blood_mid = (158, 14, 18, 255)
              for yy in range(y, y + h):
                  for xx in range(x, x + w):
                      nv = noise_val(xx, yy, seed)
                      if nv < density:
                          set_px(img, xx, yy, blood_dark if (nv % 2 == 0) else blood_mid)

          def generate_pennywise_texture(path, bloody=False):
              img = new_img(128, 128, (0, 0, 0, 0))

              skin = (238, 234, 226, 255)
              suit = (224, 220, 212, 255)
              suit_fold = (182, 176, 168, 255)
              red_makeup = (178, 16, 22, 255)
              red_dark = (118, 10, 14, 255)
              hair_red = (152, 28, 18, 255)
              pom_yellow = (236, 172, 28, 255)
              mouth_dark = (46, 5, 8, 255)
              tongue_col = (138, 22, 28, 255)
              tooth_white = (244, 238, 220, 255)
              shoe_dark = (44, 40, 44, 255)
              blood_fresh = (142, 10, 14, 255)
              blood_deep = (92, 5, 8, 255)

              # 1. upper_head (9x8x9) UV (0,0)
              paint_box(img, 0, 0, 9, 8, 9, skin, grain=6, seed=11)
              # Roof of mouth (bottom face of upper_head): x 18..27, y 0..9
              fill_rect(img, 18, 0, 9, 9, mouth_dark)
              # Front face of upper_head: x 9..18, y 9..17 (9x8)
              fx, fy = 9, 9
              # Forehead hairline & shadow
              set_px(img, fx + 0, fy + 0, hair_red)
              set_px(img, fx + 8, fy + 0, hair_red)
              set_px(img, fx + 0, fy + 1, shade(hair_red, -15))
              set_px(img, fx + 8, fy + 1, shade(hair_red, -15))
              # Forehead crease
              fill_rect(img, fx + 2, fy + 1, 5, 1, (214, 208, 198, 255))
              # Red vertical Pennywise forehead lines
              set_px(img, fx + 2, fy + 1, red_makeup)
              set_px(img, fx + 6, fy + 1, red_makeup)
              # Eyebrows (angry slanted)
              set_px(img, fx + 1, fy + 2, (58, 22, 20, 255))
              set_px(img, fx + 2, fy + 2, (48, 14, 14, 255))
              set_px(img, fx + 3, fy + 3, (48, 14, 14, 255))
              set_px(img, fx + 7, fy + 2, (58, 22, 20, 255))
              set_px(img, fx + 6, fy + 2, (48, 14, 14, 255))
              set_px(img, fx + 5, fy + 3, (48, 14, 14, 255))
              # Dark sunken eye sockets + evil glowing amber eyes
              fill_rect(img, fx + 1, fy + 3, 2, 2, (34, 18, 18, 255))
              fill_rect(img, fx + 6, fy + 3, 2, 2, (34, 18, 18, 255))
              set_px(img, fx + 2, fy + 4, (238, 188, 36, 255))
              set_px(img, fx + 6, fy + 4, (238, 188, 36, 255))
              # Vertical red makeup lines down cheeks to smile
              set_px(img, fx + 2, fy + 5, red_makeup)
              set_px(img, fx + 2, fy + 6, red_makeup)
              set_px(img, fx + 6, fy + 5, red_makeup)
              set_px(img, fx + 6, fy + 6, red_makeup)
              # Nose base & upper sinister grin
              set_px(img, fx + 4, fy + 5, red_dark)
              set_px(img, fx + 1, fy + 6, red_makeup)
              set_px(img, fx + 7, fy + 6, red_makeup)
              fill_rect(img, fx + 1, fy + 7, 7, 1, red_makeup)
              fill_rect(img, fx + 2, fy + 7, 5, 1, red_dark)

              # 2. forehead dome (8x2x8) UV (36,0)
              paint_box(img, 36, 0, 8, 2, 8, skin, grain=5, seed=12)

              # 3. nose (2x2x2) UV (36,10)
              paint_box(img, 36, 10, 2, 2, 2, (208, 18, 22, 255), grain=10, seed=13)

              # 4. teeth (1x2x1) UV (36,14)
              paint_box(img, 36, 14, 1, 2, 1, tooth_white, grain=5, seed=14)
              if bloody:
                  fill_rect(img, 36, 16, 4, 1, blood_fresh)

              # 5. inner_mouth (8x2x7) UV (44,10)
              paint_box(img, 44, 10, 8, 2, 7, mouth_dark, grain=6, seed=15)

              # 6. hair_side (4x7x8) UV (74,0)
              paint_box(img, 74, 0, 4, 7, 8, hair_red, grain=22, seed=16)

              # 7. hair_top (7x3x6) UV (98,0)
              paint_box(img, 98, 0, 7, 3, 6, hair_red, grain=22, seed=17)

              # 8. hair_back (10x7x3) UV (98,9)
              paint_box(img, 98, 9, 10, 7, 3, hair_red, grain=20, seed=18)

              # 9. hair_flare (2x5x6) UV (86,20)
              paint_box(img, 86, 20, 2, 5, 6, shade(hair_red, 10), grain=22, seed=19)

              # 10. jaw (9x3x9) UV (0,19)
              paint_box(img, 0, 19, 9, 3, 9, skin, grain=6, seed=20)
              # Top face of jaw (inside mouth floor & tongue): x 9..18, y 19..28
              fill_rect(img, 9, 19, 9, 9, mouth_dark)
              fill_rect(img, 11, 21, 5, 5, tongue_col)
              # Front face of jaw: x 9..18, y 28..31
              fill_rect(img, 11, 28, 5, 1, red_makeup)
              set_px(img, 12, 29, red_dark)
              set_px(img, 14, 29, red_dark)
              if bloody:
                  add_blood_splatter(img, 9, 28, 9, 3, density=150, seed=91)
                  fill_rect(img, 10, 28, 7, 2, blood_fresh)
                  set_px(img, 11, 30, blood_deep)
                  set_px(img, 13, 30, blood_fresh)
                  set_px(img, 15, 30, blood_deep)

              # 11. maw_cheek (1x4x5) UV (86,36) & throat back (8x4x1) UV (100,36)
              paint_box(img, 86, 36, 1, 4, 5, (92, 10, 14, 255), grain=12, seed=21)
              paint_box(img, 100, 36, 8, 4, 1, (38, 4, 7, 255), grain=6, seed=22)

              # 12. torso (10x11x6) UV (0,32)
              paint_box(img, 0, 32, 10, 11, 6, suit, grain=8, seed=23)
              # Pleated vertical lines on front & back of Victorian tunic
              for px in (7, 9, 11, 13, 15):
                  fill_rect(img, px, 38, 1, 11, suit_fold)
              # Red decorative trim lines on chest
              fill_rect(img, 6, 38, 10, 1, red_dark)
              fill_rect(img, 6, 48, 10, 1, suit_fold)
              if bloody:
                  add_blood_splatter(img, 6, 38, 10, 11, density=85, seed=92)
                  add_blood_splatter(img, 0, 38, 6, 11, density=50, seed=93)

              # 13. pom_pom (2x2x2) UV (34,32)
              paint_box(img, 34, 32, 2, 2, 2, pom_yellow, grain=18, seed=24)

              # 14. collar (12x2x9) UV (44,24) & collar_top (11x2x8) UV (44,36)
              paint_box(img, 44, 24, 12, 2, 9, (236, 232, 226, 255), grain=8, seed=25)
              for px in range(44, 86, 2):
                  fill_rect(img, px, 33, 1, 2, suit_fold)
              fill_rect(img, 44, 34, 42, 1, red_makeup)
              paint_box(img, 44, 36, 11, 2, 8, (242, 238, 232, 255), grain=6, seed=26)
              for px in range(44, 82, 2):
                  fill_rect(img, px, 44, 1, 2, suit_fold)
              if bloody:
                  add_blood_splatter(img, 50, 32, 16, 4, density=70, seed=94)

              # 15. pelvis (9x4x5) UV (0,50) & skirt_fb (9x4x1) UV (30,50) & skirt_lr (1x4x6) UV (52,50)
              paint_box(img, 0, 50, 9, 4, 5, suit, grain=8, seed=27)
              fill_rect(img, 0, 55, 28, 1, (150, 144, 136, 255))
              paint_box(img, 30, 50, 9, 4, 1, suit, grain=8, seed=28)
              fill_rect(img, 30, 54, 20, 1, red_dark)
              paint_box(img, 52, 50, 1, 4, 6, suit, grain=8, seed=29)
              fill_rect(img, 52, 59, 14, 1, red_dark)
              if bloody:
                  add_blood_splatter(img, 30, 51, 20, 4, density=75, seed=95)

              # 16. Arms: puffed_shoulder (5x6x6) UV (0,64), forearm (4x6x4) UV (24,64),
              #     wrist_cuff (5x2x5) UV (42,64), hand (4x4x4) UV (64,64)
              paint_box(img, 0, 64, 5, 6, 6, suit, grain=8, seed=30)
              for px in range(0, 22, 3):
                  fill_rect(img, px, 70, 1, 6, suit_fold)
              paint_box(img, 24, 64, 4, 6, 4, suit, grain=8, seed=31)
              paint_box(img, 42, 64, 5, 2, 5, (238, 234, 228, 255), grain=7, seed=32)
              fill_rect(img, 42, 70, 20, 1, red_makeup)
              paint_box(img, 64, 64, 4, 4, 4, (236, 232, 226, 255), grain=6, seed=33)
              # Light blood smudges on hands even in clean version (like video)
              add_blood_splatter(img, 64, 69, 16, 3, density=55, seed=34)
              add_blood_splatter(img, 24, 71, 16, 3, density=30, seed=35)
              if bloody:
                  add_blood_splatter(img, 64, 64, 16, 8, density=190, seed=96)
                  add_blood_splatter(img, 42, 64, 20, 7, density=140, seed=97)
                  add_blood_splatter(img, 24, 68, 16, 6, density=110, seed=98)
                  add_blood_splatter(img, 0, 70, 22, 6, density=65, seed=99)

              # 17. Legs: thigh (5x7x5) UV (0,80), shin (4x5x4) UV (22,80), shoe (4x2x6) UV (40,80)
              paint_box(img, 0, 80, 5, 7, 5, suit, grain=8, seed=36)
              paint_box(img, 22, 80, 4, 5, 4, suit, grain=8, seed=37)
              add_blood_splatter(img, 22, 84, 16, 5, density=45, seed=38)
              if bloody:
                  add_blood_splatter(img, 0, 85, 20, 7, density=75, seed=100)
                  add_blood_splatter(img, 22, 84, 16, 5, density=110, seed=101)
              paint_box(img, 40, 80, 4, 2, 6, shoe_dark, grain=6, seed=39)
              # Red clown pom accent on shoe front
              fill_rect(img, 47, 86, 2, 1, red_makeup)

              save_png(path, 128, 128, img)

          def generate_victim_texture(path):
              # Standard 64x64 Minecraft player skin UV (white outfit + brown hair from video)
              img = new_img(64, 64, (0, 0, 0, 0))
              skin = (232, 188, 152, 255)
              hair = (88, 54, 34, 255)
              shirt = (240, 240, 242, 255)
              pants = (232, 232, 236, 255)
              shoe = (108, 70, 44, 255)

              # Head (8x8x8) UV (0,0)
              paint_box(img, 0, 0, 8, 8, 8, skin, grain=4, seed=50)
              # Hair on top, back, sides, and bangs
              fill_rect(img, 8, 0, 8, 8, hair)
              fill_rect(img, 24, 8, 8, 7, hair)
              fill_rect(img, 0, 8, 8, 3, hair)
              fill_rect(img, 16, 8, 8, 3, hair)
              fill_rect(img, 8, 8, 8, 2, hair)
              set_px(img, 8, 10, hair)
              set_px(img, 15, 10, hair)
              # Eyes and mouth on face (x 8..16, y 8..16)
              set_px(img, 9, 12, (245, 245, 245, 255))
              set_px(img, 10, 12, (56, 42, 34, 255))
              set_px(img, 13, 12, (56, 42, 34, 255))
              set_px(img, 14, 12, (245, 245, 245, 255))
              fill_rect(img, 11, 14, 2, 1, (176, 124, 98, 255))

              # Torso (8x12x4) UV (16,16) - white shirt
              paint_box(img, 16, 16, 8, 12, 4, shirt, grain=5, seed=51)
              fill_rect(img, 20, 20, 8, 1, (212, 212, 218, 255))

              # Right Arm (4x12x4) UV (40,16) & Left Arm (4x12x4) UV (32,48)
              for au, av in ((40, 16), (32, 48)):
                  paint_box(img, au, av, 4, 12, 4, shirt, grain=5, seed=52)
                  fill_rect(img, au, av + 12, 16, 4, skin)
                  fill_rect(img, au + 8, av, 4, 4, skin)

              # Right Leg (4x12x4) UV (0,16) & Left Leg (4x12x4) UV (16,48)
              for lu, lv in ((0, 16), (16, 48)):
                  paint_box(img, lu, lv, 4, 12, 4, pants, grain=5, seed=53)
                  fill_rect(img, lu, lv + 13, 16, 3, shoe)
                  fill_rect(img, lu + 8, lv, 4, 4, shoe)

              save_png(path, 64, 64, img)

          # Generate PNG textures
          generate_pennywise_texture("src/main/resources/assets/pennywisemod/textures/entity/pennywise.png", bloody=False)
          generate_pennywise_texture("src/main/resources/assets/pennywisemod/textures/entity/pennywise_bloody.png", bloody=True)
          generate_victim_texture("src/main/resources/assets/pennywisemod/textures/entity/victim.png")

          # Gradle build files
          write_file("settings.gradle", """\
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = 'MinecraftForge'
                      url = 'https://maven.minecraftforge.net/'
                  }
                  mavenCentral()
              }
          }
          rootProject.name = 'pennywisemod'
          """)

          write_file("gradle.properties", """\
          org.gradle.jvmargs=-Xmx4G
          org.gradle.daemon=false
          """)

          write_file("build.gradle", """\
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          version = '1.0.0'
          group = 'com.pennywisemod'

          base {
              archivesName = 'pennywisemod'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'
              copyIdeResources = true
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }

          tasks.named('jar', Jar).configure {
              manifest {
                  attributes([
                      'Specification-Title'    : 'pennywisemod',
                      'Specification-Vendor'   : 'PennywiseMod',
                      'Specification-Version'  : '1',
                      'Implementation-Title'   : project.name,
                      'Implementation-Version' : project.version,
                      'Implementation-Vendor'  : 'PennywiseMod'
                  ])
              }
              finalizedBy 'reobfJar'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          """)

          # Mod metadata & resources
          write_file("src/main/resources/META-INF/mods.toml", """\
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"

          [[mods]]
          modId="pennywisemod"
          version="1.0.0"
          displayName="Pennywise IT Mod"
          authors="PennywiseMod"
          description="Pennywise 3D model, jaw-unhinging grab and devour animation, blood particles, and Victim NPC for Forge 1.20.1."

          [[dependencies.pennywisemod]]
              modId="forge"
              mandatory=true
              versionRange="[47,)"
              ordering="NONE"
              side="BOTH"

          [[dependencies.pennywisemod]]
              modId="minecraft"
              mandatory=true
              versionRange="[1.20.1,1.21)"
              ordering="NONE"
              side="BOTH"
          """)

          write_file("src/main/resources/pack.mcmeta", """\
          {
            "pack": {
              "description": "Pennywise IT Mod Resources",
              "pack_format": 15
            }
          }
          """)

          write_file("src/main/resources/assets/pennywisemod/lang/en_us.json", """\
          {
            "entity.pennywisemod.pennywise": "Pennywise",
            "entity.pennywisemod.victim": "Victim",
            "item.pennywisemod.pennywise_spawn_egg": "Pennywise Spawn Egg",
            "item.pennywisemod.victim_spawn_egg": "Victim Spawn Egg"
          }
          """)

          write_file("src/main/resources/assets/pennywisemod/lang/pt_br.json", """\
          {
            "entity.pennywisemod.pennywise": "Pennywise",
            "entity.pennywisemod.victim": "Vitima",
            "item.pennywisemod.pennywise_spawn_egg": "Ovo de Invocacao do Pennywise",
            "item.pennywisemod.victim_spawn_egg": "Ovo de Invocacao de Vitima"
          }
          """)

          write_file("src/main/resources/assets/pennywisemod/models/item/pennywise_spawn_egg.json", """\
          {
            "parent": "minecraft:item/template_spawn_egg"
          }
          """)

          write_file("src/main/resources/assets/pennywisemod/models/item/victim_spawn_egg.json", """\
          {
            "parent": "minecraft:item/template_spawn_egg"
          }
          """)

          # Main Mod Class
          write_file("src/main/java/com/pennywisemod/PennywiseMod.java", """\
          package com.pennywisemod;

          import com.pennywisemod.entity.PennywiseEntity;
          import com.pennywisemod.entity.VictimEntity;
          import com.pennywisemod.registry.ModEntities;
          import com.pennywisemod.registry.ModItems;
          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraftforge.event.BuildCreativeModeTabContentsEvent;
          import net.minecraftforge.event.entity.EntityAttributeCreationEvent;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;

          @Mod(PennywiseMod.MOD_ID)
          public class PennywiseMod {
              public static final String MOD_ID = "pennywisemod";

              public PennywiseMod() {
                  IEventBus modEventBus = FMLJavaModLoadingContext.get().getModEventBus();
                  ModEntities.register(modEventBus);
                  ModItems.register(modEventBus);
                  modEventBus.addListener(this::addCreative);
                  modEventBus.addListener(this::registerAttributes);
              }

              private void addCreative(BuildCreativeModeTabContentsEvent event) {
                  if (event.getTabKey() == CreativeModeTabs.SPAWN_EGGS) {
                      event.accept(ModItems.PENNYWISE_SPAWN_EGG.get());
                      event.accept(ModItems.VICTIM_SPAWN_EGG.get());
                  }
              }

              private void registerAttributes(EntityAttributeCreationEvent event) {
                  event.put(ModEntities.PENNYWISE.get(), PennywiseEntity.createAttributes().build());
                  event.put(ModEntities.VICTIM.get(), VictimEntity.createAttributes().build());
              }
          }
          """)

          # Registry: ModEntities
          write_file("src/main/java/com/pennywisemod/registry/ModEntities.java", """\
          package com.pennywisemod.registry;

          import com.pennywisemod.PennywiseMod;
          import com.pennywisemod.entity.PennywiseEntity;
          import com.pennywisemod.entity.VictimEntity;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.MobCategory;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          public class ModEntities {
              public static final DeferredRegister<EntityType<?>> ENTITY_TYPES =
                      DeferredRegister.create(ForgeRegistries.ENTITY_TYPES, PennywiseMod.MOD_ID);

              public static final RegistryObject<EntityType<PennywiseEntity>> PENNYWISE =
                      ENTITY_TYPES.register("pennywise", () ->
                              EntityType.Builder.of(PennywiseEntity::new, MobCategory.MONSTER)
                                      .sized(0.85F, 2.55F)
                                      .clientTrackingRange(10)
                                      .build("pennywise"));

              public static final RegistryObject<EntityType<VictimEntity>> VICTIM =
                      ENTITY_TYPES.register("victim", () ->
                              EntityType.Builder.of(VictimEntity::new, MobCategory.CREATURE)
                                      .sized(0.6F, 1.8F)
                                      .clientTrackingRange(8)
                                      .build("victim"));

              public static void register(IEventBus eventBus) {
                  ENTITY_TYPES.register(eventBus);
              }
          }
          """)

