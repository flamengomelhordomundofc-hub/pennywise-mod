          package com.pennywisemod.client;

          import com.pennywisemod.PennywiseMod;
          import com.pennywisemod.entity.PennywiseEntity;
          import net.minecraft.client.model.HierarchicalModel;
          import net.minecraft.client.model.geom.ModelLayerLocation;
          import net.minecraft.client.model.geom.ModelPart;
          import net.minecraft.client.model.geom.PartPose;
          import net.minecraft.client.model.geom.builders.CubeDeformation;
          import net.minecraft.client.model.geom.builders.CubeListBuilder;
          import net.minecraft.client.model.geom.builders.LayerDefinition;
          import net.minecraft.client.model.geom.builders.MeshDefinition;
          import net.minecraft.client.model.geom.builders.PartDefinition;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.util.Mth;

          public class PennywiseModel extends HierarchicalModel<PennywiseEntity> {
              public static final ModelLayerLocation LAYER_LOCATION =
                      new ModelLayerLocation(new ResourceLocation(PennywiseMod.MOD_ID, "pennywise"), "main");

              private final ModelPart root;
              private final ModelPart torso;
              private final ModelPart head;
              private final ModelPart upperHead;
              private final ModelPart upperTeeth;
              private final ModelPart innerMouth;
              private final ModelPart jaw;
              private final ModelPart lowerTeeth;
              private final ModelPart mawCheeks;
              private final ModelPart rightArm;
              private final ModelPart rightForearm;
              private final ModelPart leftArm;
              private final ModelPart leftForearm;
              private final ModelPart rightLeg;
              private final ModelPart rightShin;
              private final ModelPart leftLeg;
              private final ModelPart leftShin;

              public PennywiseModel(ModelPart root) {
                  this.root = root;
                  ModelPart bodyRoot = root.getChild("body_root");
                  ModelPart pelvis = bodyRoot.getChild("pelvis");
                  this.torso = pelvis.getChild("torso");
                  this.head = this.torso.getChild("head");
                  this.upperHead = this.head.getChild("upper_head");
                  this.upperTeeth = this.upperHead.getChild("upper_teeth");
                  this.innerMouth = this.upperHead.getChild("inner_mouth");
                  this.jaw = this.head.getChild("jaw");
                  this.lowerTeeth = this.jaw.getChild("lower_teeth");
                  this.mawCheeks = this.head.getChild("maw_cheeks");
                  this.rightArm = this.torso.getChild("right_arm");
                  this.rightForearm = this.rightArm.getChild("right_forearm");
                  this.leftArm = this.torso.getChild("left_arm");
                  this.leftForearm = this.leftArm.getChild("left_forearm");
                  this.rightLeg = bodyRoot.getChild("right_leg");
                  this.rightShin = this.rightLeg.getChild("right_shin");
                  this.leftLeg = bodyRoot.getChild("left_leg");
                  this.leftShin = this.leftLeg.getChild("left_shin");
              }

              public static LayerDefinition createBodyLayer() {
                  MeshDefinition mesh = new MeshDefinition();
                  PartDefinition root = mesh.getRoot();

                  PartDefinition bodyRoot = root.addOrReplaceChild("body_root",
                          CubeListBuilder.create(),
                          PartPose.offset(0.0F, 24.0F, 0.0F));

                  // Pelvis + Victorian pleated clown tunic skirt
                  PartDefinition pelvis = bodyRoot.addOrReplaceChild("pelvis",
                          CubeListBuilder.create()
                                  .texOffs(0, 50).addBox(-4.5F, -4.0F, -2.5F, 9.0F, 4.0F, 5.0F)
                                  .texOffs(30, 50).addBox(-4.5F, -0.5F, -3.5F, 9.0F, 4.0F, 1.0F)
                                  .texOffs(30, 50).addBox(-4.5F, -0.5F, 2.5F, 9.0F, 4.0F, 1.0F)
                                  .texOffs(52, 50).addBox(-5.2F, -0.5F, -3.0F, 1.0F, 4.0F, 6.0F)
                                  .texOffs(52, 50).addBox(4.2F, -0.5F, -3.0F, 1.0F, 4.0F, 6.0F),
                          PartPose.offset(0.0F, -14.0F, 0.0F));

                  // Torso + 2 yellow-orange pom-poms + double Victorian neck ruffles
                  PartDefinition torso = pelvis.addOrReplaceChild("torso",
                          CubeListBuilder.create()
                                  .texOffs(0, 32).addBox(-5.0F, -11.0F, -3.0F, 10.0F, 11.0F, 6.0F)
                                  .texOffs(34, 32).addBox(-1.0F, -8.5F, -4.2F, 2.0F, 2.0F, 2.0F)
                                  .texOffs(34, 32).addBox(-1.0F, -4.5F, -4.2F, 2.0F, 2.0F, 2.0F)
                                  .texOffs(44, 24).addBox(-6.0F, -12.6F, -4.5F, 12.0F, 2.0F, 9.0F)
                                  .texOffs(44, 36).addBox(-5.5F, -14.0F, -4.0F, 11.0F, 2.0F, 8.0F),
                          PartPose.offset(0.0F, -4.0F, 0.0F));

                  // Head root
                  PartDefinition head = torso.addOrReplaceChild("head",
