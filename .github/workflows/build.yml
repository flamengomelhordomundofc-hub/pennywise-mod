                  // Upper razor-sharp teeth row (visible when jaw unhinges!)
                  CubeListBuilder upperTeethBuilder = CubeListBuilder.create();
                  for (int i = 0; i < 6; i++) {
                      float tx = -3.7F + i * 1.28F;
                      upperTeethBuilder.texOffs(36, 14).addBox(tx, -0.3F, -6.1F, 1.0F, 2.0F, 1.0F, new CubeDeformation(-0.12F));
                      upperTeethBuilder.texOffs(36, 14).addBox(tx, -0.5F, -4.6F, 1.0F, 2.0F, 1.0F, new CubeDeformation(-0.16F));
