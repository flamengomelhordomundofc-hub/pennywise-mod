          write_file("src/main/java/com/pennywisemod/client/ClientEvents.java", """\
          package com.pennywisemod.client;

          import com.pennywisemod.PennywiseMod;
          import com.pennywisemod.registry.ModEntities;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.EntityRenderersEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = PennywiseMod.MOD_ID, bus = Mod.EventBusSubscriber.Bus.MOD, value = Dist.CLIENT)
          public class ClientEvents {

              @SubscribeEvent
              public static void registerLayerDefinitions(EntityRenderersEvent.RegisterLayerDefinitions event) {
                  event.registerLayerDefinition(PennywiseModel.LAYER_LOCATION, PennywiseModel::createBodyLayer);
              }

              @SubscribeEvent
              public static void registerRenderers(EntityRenderersEvent.RegisterRenderers event) {
                  event.registerEntityRenderer(ModEntities.PENNYWISE.get(), PennywiseRenderer::new);
                  event.registerEntityRenderer(ModEntities.VICTIM.get(), VictimRenderer::new);
              }
          }
